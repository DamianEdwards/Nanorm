name: Build

on:
  workflow_call:
    inputs:
      packShipCandidate:
        required: false
        type: boolean
        default: false
      multithreaded:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    
    - name: Install .NET SDK
      uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
      with:
        dotnet-version: |
            6.0.x
        global-json-file: "./global.json"
    
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Create build number
      run: |
        dotnet --version
        buildNumber=20260101.1
        echo "BUILD_NUMBER=$buildNumber" >> $GITHUB_ENV
        echo "$buildNumber"

    - name: Build
      run: >-
        dotnet build
        --configuration Release
        --no-restore
        -p:BuildNumber=$BUILD_NUMBER
        -p:SourceRevisionId=$GITHUB_SHA
        -p:ContinuousIntegrationBuild=true
        ${{ inputs.multithreaded && '-mt' || '' }}

    - name: Test
      run: dotnet test --configuration Release --no-restore --no-build

    - name: Publish samples
      run: |
        for projectPath in ./samples/**/*.csproj ; do
          for tfm in "net7.0" "net8.0"; do
            projectFileName=${projectPath##*/}
            projectName=${projectFileName%.*}
            dotnet publish "$projectPath" --output "./artifacts/$projectName" --framework $tfm --configuration Release --verbosity normal
          done;
        done;
      
    - name: Pack (ci)
      run: >-
        dotnet pack
        --configuration Release
        --output ./artifacts/ci
        --verbosity normal
        -p:BuildNumber=$BUILD_NUMBER
        -p:SourceRevisionId=$GITHUB_SHA
        -p:ContinuousIntegrationBuild=true

    - name: Pack (ship candidate)
      if: ${{ inputs.packShipCandidate }}
      run: >-
        dotnet pack
        --configuration Release
        --output ./artifacts/ship
        --verbosity normal
        -p:BuildNumber=$BUILD_NUMBER
        -p:SourceRevisionId=$GITHUB_SHA
        -p:ContinuousIntegrationBuild=true
        -p:IsShipCandidate=true

    - name: Upload artifacts (packages)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nupkg
        path: ./artifacts/**/*.nupkg
        retention-days: 5

    - name: Output manifest
      run: |
        find src samples artifacts -type f \( -path '*/bin/Release/*' -o -path 'artifacts/*' \) | sort
